# fly.toml app configuration file generated for astronotextreams on 2026-11-13T14:11:27Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'astronotextreams'
primary_region = 'fra'

[build]
[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
